<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Watch Vault</title>

<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js" crossorigin="anonymous"></script>

<style>
:root{
  --bg:#f4f1e7; --bg2:#e9efe5; --panel:rgba(255,255,250,.95); --panel2:#fffdf5;
  --green:#006039; --green2:#0b4d32; --green3:#123c2b; --gold:#c8a44d; --gold2:#e0c675;
  --text:#183b2c; --muted:#6c776f; --line:#d9d2bc; --danger:#b53a32;
  --shadow:0 12px 34px rgba(28,57,42,.12);
}
body.dark{
  --bg:#07130e; --bg2:#0d1e16; --panel:rgba(15,29,22,.96); --panel2:#13251c;
  --green:#1c8b5d; --green2:#65b58f; --green3:#e5f1e9; --gold:#d2ae55; --gold2:#f0d67f;
  --text:#edf4ef; --muted:#a7b6ad; --line:#34483d; --danger:#ff756c;
  --shadow:0 14px 38px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(200,164,77,.12),transparent 24%),linear-gradient(135deg,var(--bg),var(--bg2));transition:.2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.shell{width:min(1320px,95%);margin:auto;padding:20px 0 42px}
.header{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.brand{text-align:center}
.brand .crown{font-size:27px;color:var(--gold);line-height:1}
.brand h1{margin:3px 0 2px;font-family:Georgia,serif;letter-spacing:.06em;font-size:clamp(2rem,4vw,3.5rem);color:var(--green3)}
.brand p{margin:0;color:var(--gold);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:11px 15px;font-weight:800;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#172017;border-color:transparent}
.btn.green{background:var(--green);color:white;border-color:transparent}
.btn.danger{color:var(--danger)}
.clock{min-width:255px;text-align:center;padding:11px 18px;background:#06110c;border:1px solid var(--gold);border-radius:15px;color:var(--gold2);box-shadow:0 0 12px rgba(200,164,77,.15)}
#clockDate{font-size:.84rem;letter-spacing:.06em}
#clockTime{font-family:"Courier New",monospace;font-size:1.55rem;font-weight:900;margin-top:4px}
.cloudbar{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 17px;box-shadow:var(--shadow);margin-bottom:16px}
.cloudicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(200,164,77,.13);border:1px solid rgba(200,164,77,.45)}
#loginStatus{font-weight:900;display:block}.small{font-size:.88rem;color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.metric{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:15px;padding:16px;box-shadow:var(--shadow)}
.metric label{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}
.metric strong{display:block;font-family:Georgia,serif;font-size:1.8rem;color:var(--green3);margin-top:6px}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab.active{background:var(--green);color:white;border-color:var(--green)}
.search{max-width:330px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}
.sectionhead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}
.sectionhead h2{margin:0;font-family:Georgia,serif;color:var(--green3)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:15px;position:relative}
.photo{aspect-ratio:4/3;background:linear-gradient(135deg,rgba(0,96,57,.13),rgba(200,164,77,.15));display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:3rem;opacity:.55}
.cardbody{padding:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:rgba(0,96,57,.10);color:var(--green2);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.card h3{font-family:Georgia,serif;margin:9px 0 3px;font-size:1.18rem}
.ref{font-size:.8rem;color:var(--muted)}
.price{margin-top:10px;font-weight:900;color:var(--gold);font-size:1.08rem}
.notes{font-size:.84rem;color:var(--muted);margin-top:7px;min-height:20px}
.cardactions{display:flex;gap:7px;margin-top:12px}
.cardactions .btn{padding:7px 9px;font-size:.78rem;box-shadow:none}
.empty{grid-column:1/-1;text-align:center;padding:55px 15px;color:var(--muted)}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalback.show{display:flex}
.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--gold);border-radius:18px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal h2{font-family:Georgia,serif;margin:0 0 16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-size:.78rem;font-weight:900;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}
.field textarea{min-height:82px;resize:vertical}
.span2{grid-column:1/-1}
.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.viewer .owner-only{display:none!important}
.viewer .cloudbar{display:none}
.viewer .cardactions{display:none}
.viewer .brand p::after{content:" • VIEW ONLY";color:var(--muted)}
.notice{margin-top:15px;font-size:.8rem;color:var(--muted);text-align:center}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.header{grid-template-columns:1fr}.brand{order:1}.header>.btn{order:2}.clock{order:3;width:100%}.cloudbar{grid-template-columns:auto 1fr}.actions{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}.search{max-width:none}}
@media(max-width:500px){.grid,.metrics,.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.cloudbar{grid-template-columns:1fr;text-align:center}.cloudicon{margin:auto}}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <button id="themeBtn" class="btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div class="brand"><div class="crown">♛</div><h1>MY WATCH VAULT</h1><p>Collection & Dream List</p></div>
    <div class="clock"><div id="clockDate"></div><div id="clockTime"></div></div>
  </header>

  <section class="cloudbar owner-only">
    <div class="cloudicon">☁️</div>
    <div><span id="loginStatus">Watch Vault Ready</span><span id="cloudStatus" class="small">Connecting to Microsoft...</span></div>
    <div class="actions">
      <button id="loginBtn" class="btn green" onclick="login()">Sign in to OneDrive</button>
      <button id="logoutBtn" class="btn" style="display:none" onclick="logout()">Sign Out</button>
      <button class="btn gold" onclick="openShareView()">👁 Share View</button>
    </div>
  </section>

  <section class="metrics">
    <div class="metric"><label>Owned Watches</label><strong id="ownedCount">0</strong></div>
    <div class="metric"><label>Collection Value</label><strong id="ownedValue">$0</strong></div>
    <div class="metric"><label>Dream Watches</label><strong id="dreamCount">0</strong></div>
    <div class="metric"><label>Dream List Value</label><strong id="dreamValue">$0</strong></div>
  </section>

  <section class="toolbar">
    <div class="tabs">
      <button class="btn tab active" data-tab="collection" onclick="setTab('collection')">⌚ My Collection</button>
      <button class="btn tab" data-tab="dream" onclick="setTab('dream')">✨ Dream Watches</button>
      <button class="btn tab" data-tab="all" onclick="setTab('all')">All Watches</button>
    </div>
    <input id="search" class="search" placeholder="Search brand, model, reference..." oninput="render()">
  </section>

  <section class="section">
    <div class="sectionhead">
      <h2 id="sectionTitle">My Collection</h2>
      <button class="btn gold owner-only" onclick="openModal()">＋ Add Watch</button>
    </div>
    <div id="watchGrid" class="grid"></div>
    <div class="notice">Owner data syncs to your Microsoft OneDrive App Folder. Viewer mode is read-only.</div>
  </section>
</div>

<div id="modalBack" class="modalback owner-only" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">Add Watch</h2>
    <div class="formgrid">
      <div class="field"><label>Section</label><select id="fSection"><option value="collection">My Collection</option><option value="dream">Dream Watches</option></select></div>
      <div class="field"><label>Brand</label><input id="fBrand" placeholder="Rolex"></div>
      <div class="field"><label>Model</label><input id="fModel" placeholder="Submariner"></div>
      <div class="field"><label>Reference</label><input id="fRef" placeholder="126610LN"></div>
      <div class="field"><label>Price / Value ($)</label><input id="fPrice" type="number" min="0" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Date Acquired / Target Date</label><input id="fDate" type="date"></div>
      <div class="field span2"><label>Watch Photo</label><input id="fPhoto" type="file" accept="image/*"></div>
      <div class="field span2"><label>Notes</label><textarea id="fNotes" placeholder="Condition, dial, bracelet, seller, why I want it..."></textarea></div>
    </div>
    <div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn green" onclick="saveWatch()">Save Watch</button></div>
  </div>
</div>

<script>
const DATA_FILE="watch-vault-data.json";
const GRAPH_SCOPE="Files.ReadWrite.AppFolder";
const CLIENT_ID="21bd0739-b841-4a39-97ef-9b05c3c7be8f";
let msalInstance=null, graphAccount=null, cloudReady=false, editingId=null, activeTab="collection";
let vault={watches:[]};

const params=new URLSearchParams(location.search);
const viewerMode=params.get("view")==="1";
if(viewerMode) document.body.classList.add("viewer");

function applyTheme(t){document.body.classList.toggle("dark",t==="dark");document.getElementById("themeBtn").textContent=t==="dark"?"☀️ Light Mode":"🌙 Dark Mode"}
function toggleTheme(){const t=document.body.classList.contains("dark")?"light":"dark";localStorage.setItem("watchVaultTheme",t);applyTheme(t)}
applyTheme(localStorage.getItem("watchVaultTheme")||((matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"));

function tick(){const n=new Date();document.getElementById("clockDate").textContent=n.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});document.getElementById("clockTime").textContent=n.toLocaleTimeString()}
tick();setInterval(tick,1000);

function money(v){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(v)||0)}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function setTab(t){activeTab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("sectionTitle").textContent=t==="collection"?"My Collection":t==="dream"?"Dream Watches":"All Watches";render()}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const owned=vault.watches.filter(w=>w.section==="collection"), dream=vault.watches.filter(w=>w.section==="dream");
  document.getElementById("ownedCount").textContent=owned.length;
  document.getElementById("dreamCount").textContent=dream.length;
  document.getElementById("ownedValue").textContent=money(owned.reduce((s,w)=>s+(Number(w.price)||0),0));
  document.getElementById("dreamValue").textContent=money(dream.reduce((s,w)=>s+(Number(w.price)||0),0));
  let list=vault.watches.filter(w=>(activeTab==="all"||w.section===activeTab)&&(`${w.brand} ${w.model} ${w.ref} ${w.notes}`.toLowerCase().includes(q)));
  const g=document.getElementById("watchGrid");
  if(!list.length){g.innerHTML=`<div class="empty">No watches here yet.<br><span class="owner-only">Click <b>Add Watch</b> to start your vault.</span></div>`;return}
  g.innerHTML=list.map(w=>`<article class="card">
    <div class="photo">${w.photo?`<img src="${w.photo}" alt="${esc(w.brand+" "+w.model)}">`:`<div class="placeholder">⌚</div>`}</div>
    <div class="cardbody">
      <span class="badge">${w.section==="collection"?"Owned":"Dream Watch"}</span>
      <h3>${esc(w.brand)} ${esc(w.model)}</h3>
      <div class="ref">${w.ref?`Ref. ${esc(w.ref)}`:"No reference entered"}</div>
      <div class="price">${money(w.price)}</div>
      <div class="notes">${esc(w.notes||"")}</div>
      <div class="cardactions owner-only">
        <button class="btn" onclick="editWatch('${w.id}')">Edit</button>
        <button class="btn" onclick="moveWatch('${w.id}')">${w.section==="collection"?"Move to Dreams":"Mark Owned"}</button>
        <button class="btn danger" onclick="deleteWatch('${w.id}')">Delete</button>
      </div>
    </div></article>`).join("");
}
function openModal(){editingId=null;document.getElementById("modalTitle").textContent="Add Watch";["fBrand","fModel","fRef","fPrice","fDate","fNotes"].forEach(id=>document.getElementById(id).value="");document.getElementById("fPhoto").value="";document.getElementById("fSection").value=activeTab==="dream"?"dream":"collection";document.getElementById("modalBack").classList.add("show")}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
function editWatch(id){const w=vault.watches.find(x=>x.id===id);if(!w)return;editingId=id;document.getElementById("modalTitle").textContent="Edit Watch";document.getElementById("fSection").value=w.section;document.getElementById("fBrand").value=w.brand||"";document.getElementById("fModel").value=w.model||"";document.getElementById("fRef").value=w.ref||"";document.getElementById("fPrice").value=w.price||"";document.getElementById("fDate").value=w.date||"";document.getElementById("fNotes").value=w.notes||"";document.getElementById("fPhoto").value="";document.getElementById("modalBack").classList.add("show")}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveWatch(){
  const brand=document.getElementById("fBrand").value.trim(), model=document.getElementById("fModel").value.trim();
  if(!brand||!model){alert("Please enter the brand and model.");return}
  let old=editingId?vault.watches.find(x=>x.id===editingId):null, photo=old?.photo||"";
  const file=document.getElementById("fPhoto").files[0]; if(file) photo=await fileToDataURL(file);
  const w={id:editingId||String(Date.now()),section:document.getElementById("fSection").value,brand,model,ref:document.getElementById("fRef").value.trim(),price:Number(document.getElementById("fPrice").value)||0,date:document.getElementById("fDate").value,notes:document.getElementById("fNotes").value.trim(),photo};
  if(editingId) vault.watches=vault.watches.map(x=>x.id===editingId?w:x); else vault.watches.unshift(w);
  closeModal();render();await saveCloud();
}
async function deleteWatch(id){if(!confirm("Delete this watch?"))return;vault.watches=vault.watches.filter(w=>w.id!==id);render();await saveCloud()}
async function moveWatch(id){const w=vault.watches.find(x=>x.id===id);if(!w)return;w.section=w.section==="collection"?"dream":"collection";render();await saveCloud()}
function openShareView(){
  // Read-only preview. For a true public live link, the hosting layer must publish a read-only data snapshot.
  const u=new URL(location.href);u.searchParams.set("view","1");window.open(u.toString(),"_blank");
}

const msalConfig={auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+"/"},cache:{cacheLocation:"localStorage",storeAuthStateInCookie:false}};
function initMSAL(){if(typeof msal==="undefined")return false;msalInstance=new msal.PublicClientApplication(msalConfig);const a=msalInstance.getAllAccounts();if(a.length){graphAccount=a[0];msalInstance.setActiveAccount(graphAccount)}return true}
async function login(){await msalInstance.loginRedirect({scopes:[GRAPH_SCOPE],redirectUri:location.origin+"/"})}
async function logout(){const a=graphAccount||msalInstance.getActiveAccount()||msalInstance.getAllAccounts()[0];await msalInstance.logoutRedirect({account:a||undefined,postLogoutRedirectUri:location.origin+"/"})}
async function token(){const a=graphAccount||msalInstance.getActiveAccount()||msalInstance.getAllAccounts()[0];if(!a)throw new Error("No Microsoft account signed in.");try{return (await msalInstance.acquireTokenSilent({scopes:[GRAPH_SCOPE],account:a})).accessToken}catch(e){await msalInstance.acquireTokenRedirect({scopes:[GRAPH_SCOPE],account:a,redirectUri:location.origin+"/"});throw e}}
async function loadCloud(){
  try{
    document.getElementById("cloudStatus").textContent="Connecting to OneDrive...";
    const t=await token(),r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${DATA_FILE}:/content`,{headers:{Authorization:"Bearer "+t}});
    if(r.status===404){cloudReady=true;document.getElementById("cloudStatus").textContent="OneDrive connected ✓";render();return}
    if(!r.ok)throw new Error("Load failed "+r.status);
    const d=await r.json();if(d&&Array.isArray(d.watches))vault=d;
    cloudReady=true;document.getElementById("cloudStatus").textContent="OneDrive synced ✓";render();
  }catch(e){cloudReady=false;document.getElementById("cloudStatus").textContent="Sign in to connect your OneDrive";}
}
async function saveCloud(){
  if(!cloudReady||viewerMode)return;
  try{const t=await token(),r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${DATA_FILE}:/content`,{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(vault)});if(!r.ok)throw new Error("Save failed");document.getElementById("cloudStatus").textContent="Saved to OneDrive ✓"}catch(e){document.getElementById("cloudStatus").textContent="OneDrive save failed"}
}
async function start(){
  render();
  if(viewerMode)return;
  if(!initMSAL()){document.getElementById("cloudStatus").textContent="Microsoft authentication library failed to load.";return}
  try{
    const result=await msalInstance.handleRedirectPromise();
    if(result?.account){graphAccount=result.account;msalInstance.setActiveAccount(graphAccount)}
    const a=msalInstance.getAllAccounts();
    if(a.length){graphAccount=graphAccount||a[0];document.getElementById("loginStatus").textContent="Signed in as "+(graphAccount.username||"Microsoft account");document.getElementById("loginBtn").style.display="none";document.getElementById("logoutBtn").style.display="inline-block";await loadCloud()}
    else document.getElementById("cloudStatus").textContent="Sign in to connect your personal OneDrive";
  }catch(e){document.getElementById("cloudStatus").textContent="Microsoft sign-in error"}
}
start();
</script>
</body>
</html>
